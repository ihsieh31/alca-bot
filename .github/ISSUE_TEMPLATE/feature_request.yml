name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy
      description: Does this touch approvals, the policy gateway, secrets, untrusted text, remote access or memory? How should it stay safe?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
